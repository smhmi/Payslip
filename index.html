<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سامانه فیش حقوقی</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .header {
            background: #ffffff;
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
        }

        .header p {
            margin: 10px 0 0;
            color: #777;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .welcome {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .welcome h2 {
            margin-top: 0;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 30px;
            background: #1677ff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .footer {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<header class="header">
    <h1>سامانه فیش حقوقی</h1>
    <p>داروخانه شبانه روزی قوامین</p>
</header>

<main class="container">

    <section class="welcome">

        <h2>به سامانه فیش حقوقی خوش آمدید</h2>

        <p>
            برای مشاهده فیش حقوقی خود از لینک اختصاصی که در اختیار شما قرار گرفته است استفاده کنید.
        </p>

    </section>

    <div class="footer">
        سامانه فیش حقوقی - ۱۴۰۵
    </div>

</main>

</body>
</html>
